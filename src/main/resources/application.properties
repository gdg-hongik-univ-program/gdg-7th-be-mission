spring.application.name=mission

# Swagger UI 접속 경로 설정 (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# 태그(그룹) 및 API 엔드포인트 알파벳순 정렬
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Swagger 문서화 대상을 특정 패키지로 제한
springdoc.packages-to-scan=gdg.hongik.mission.controller